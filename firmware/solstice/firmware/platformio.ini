; PlatformIO project for the ESP32-S3 Feather build.
; UNTESTED: written without a toolchain or hardware. Library versions and the
; board name are my best knowledge; adjust if PlatformIO complains.
[env:feather_s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit BNO08x
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit Unified Sensor
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../core
    -DBALLISTICS_REAL=float
