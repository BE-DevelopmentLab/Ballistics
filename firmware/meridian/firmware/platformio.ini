; Meridian (Celestial V2 rifle-mounted unit): Adafruit Feather ESP32-S3, 8 MB flash, no PSRAM.
; Not yet built with PlatformIO (the cloud session that wrote it could not download the toolchain).
; Same platform and library family as Solstice, which builds on the laptop.
[env:meridian]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit BNO08x
    adafruit/Adafruit GPS Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit LC709203F
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../core
    -I../../core
    -DBALLISTICS_REAL=float
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
